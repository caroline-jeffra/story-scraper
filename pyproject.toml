[project]
name = "story-scraper"
version = "0.1.0"
description = "A small package for retrieving collections of html formatted short stories and generating custom epub digests"
authors = [
    { name = "Caroline Jeffra", email = "caroline.jeffra@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.2",
]

[project.scripts]
story-scraper = "story_scraper.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
